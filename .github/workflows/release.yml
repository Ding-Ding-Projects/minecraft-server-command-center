name: Build and release Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ""
      CSC_KEY_PASSWORD: ""
      WIN_CSC_LINK: ""
      WIN_CSC_KEY_PASSWORD: ""
      SQUIRREL_OUTPUT: release/squirrel-windows/squirrel-windows
    steps:
      - name: Record workflow start
        id: timing
        shell: pwsh
        run: |
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm install --no-audit --no-fund

      - name: Set a unique release version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          npm pkg set version=$version

      - name: Build Windows Squirrel artifacts
        run: npm run dist

      - name: Verify unsigned Squirrel installer
        run: npm run verify:unsigned

      - name: Collect safe packaging outputs
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path $env:SQUIRREL_OUTPUT) {
            Copy-Item -Recurse -Force $env:SQUIRREL_OUTPUT artifacts/squirrel-windows
          }
          @(
            "run_id=$env:GITHUB_RUN_ID",
            "commit=$env:GITHUB_SHA",
            "runner=$env:RUNNER_OS"
          ) | Set-Content -Encoding utf8 artifacts/build-context.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WORKFLOW_STARTED: ${{ steps.timing.outputs.started }}
        shell: pwsh
        run: |
          $started = [DateTimeOffset]::Parse($env:WORKFLOW_STARTED)
          $initialNotes = @(
            "# Minecraft Server Command Center $env:RELEASE_VERSION",
            "",
            "Windows Squirrel.Windows artifacts are unsigned and may trigger an unknown-publisher warning.",
            "",
            "Workflow started: $($started.ToUniversalTime().ToString('o'))",
            "Release-publication timing is finalized immediately after gh release create succeeds.",
            "GitHub Actions records terminal workflow completion after remaining steps; this release note does not claim a terminal workflow completion time.",
            "",
            "A separate safe-packaging artifact upload is attempted after release publication. It is evidence-only, not a release asset, and is excluded from the release-publication elapsed time.",
            "",
            "This workflow builds and packages only; it does not run tests or lint."
          )
          $initialNotes | Set-Content -Encoding utf8 release-notes.md
          $assets = Get-ChildItem $env:SQUIRREL_OUTPUT -File | Select-Object -ExpandProperty FullName
          if ($assets.Count -eq 0) { throw "No Squirrel.Windows assets were produced." }
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "Minecraft Server Command Center $env:RELEASE_VERSION" --notes-file release-notes.md
          $published = [DateTimeOffset]::UtcNow
          $duration = $published - $started
          $finalNotes = @(
            "# Minecraft Server Command Center $env:RELEASE_VERSION",
            "",
            "Windows Squirrel.Windows artifacts are unsigned and may trigger an unknown-publisher warning.",
            "",
            "Workflow started: $($started.ToUniversalTime().ToString('o'))",
            "Release publication completed: $($published.ToUniversalTime().ToString('o'))",
            "Elapsed through gh release create: $($duration.ToString('hh\:mm\:ss'))",
            "GitHub Actions records terminal workflow completion after remaining steps; this release note does not claim a terminal workflow completion time.",
            "",
            "A separate safe-packaging artifact upload is attempted after release publication. It is evidence-only, not a release asset, and is excluded from the release-publication elapsed time.",
            "",
            "This workflow builds and packages only; it does not run tests or lint."
          )
          $finalNotes | Set-Content -Encoding utf8 release-notes.md
          gh release edit $env:RELEASE_TAG --notes-file release-notes.md

      - name: Upload safe packaging outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-squirrel-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
